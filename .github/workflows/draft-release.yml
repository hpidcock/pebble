name: Draft release

# Reusable workflow that tags the tip of the given branch with the version
# currently in cmd/version.go, builds it as a sanity check, and drafts a
# GitHub release for it. The release title and notes are generated by the
# opencode GitHub Action, using the previous releases (of the same kind:
# FIPS or non-FIPS) as style examples.
#
# This never publishes the release -- publishing (and monitoring the resulting
# binaries/snap workflows, and promoting the snap) remains a manual step, see
# HACKING.md.
#
# Callers: prepare-release.yml, for both the non-FIPS and FIPS flows.

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Branch to tag and draft a release from (master or fips)"
        required: true
        type: string
      fips:
        description: "Whether this is a FIPS release (changes which previous releases are used as examples)"
        required: false
        type: boolean
        default: false

# NOTE: because permissions can only be narrowed (never widened) as they flow
# through a chain of reusable workflow calls, this `permissions:` block alone
# isn't enough -- the caller job (in prepare-release.yml) must also grant at
# least `contents: write` for the token used here to actually be able to
# push the tag and create the release.
permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ inputs.target-branch }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Determine version and create tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' cmd/version.go)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version from cmd/version.go"
            exit 1
          fi
          echo "Version is ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" HEAD
          git push origin "$VERSION"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Run the build
        run: |
          set -eu
          go generate ./cmd
          go build ./...

      - name: Gather previous release notes for context
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIPS: ${{ inputs.fips }}
        run: |
          set -eu
          mkdir -p .release
          if [[ "$FIPS" == "true" ]]; then
            MATCH_PATTERN='-fips$'
          else
            MATCH_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi

          gh release list --exclude-drafts --limit 50 --json tagName \
            --jq '.[].tagName' | grep -E "$MATCH_PATTERN" | head -n 5 > .release/previous-tags.txt || true

          : > .release/previous-notes.md
          while read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "## ${tag}" >> .release/previous-notes.md
            gh release view "$tag" --json body --jq .body >> .release/previous-notes.md
            printf '\n---\n\n' >> .release/previous-notes.md
          done < .release/previous-tags.txt

          PREV_TAG=$(head -n 1 .release/previous-tags.txt || true)
          echo "previous-tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Gather commit log since previous release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.previous.outputs.previous-tag }}
        run: |
          set -eu
          if [[ -n "$PREV_TAG" ]]; then
            git --no-pager log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${VERSION}" > .release/commits.txt
          else
            git --no-pager log --no-merges --pretty=format:'- %s (%h)' "${VERSION}" > .release/commits.txt
          fi

      - name: Generate release title and notes with opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a  # latest (github-v1.2.19)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with:
          model: openrouter/google/gemini-3.7-flash
          prompt: |
            Write GitHub release notes for Pebble version ${{ steps.version.outputs.version }}.

            Read `.release/previous-notes.md`: it contains the notes from the
            previous few ${{ inputs.fips && 'FIPS' || 'non-FIPS' }} Pebble
            releases. Use them purely as style/format/tone/detail-level
            examples -- don't reuse their content.

            Read `.release/commits.txt`: it's the list of commits included in
            this release. Use it to understand what actually changed, and
            group/describe the changes sensibly (e.g. features, fixes).

            Write your output to exactly these two files, and don't modify,
            commit, or push anything else:
              - `.release/title.txt`: a single-line release title that
                includes the version number and a short summary of the
                release.
              - `.release/notes.md`: the full release notes body in Markdown.
                If `.release/previous-tags.txt` has a previous tag on its
                first line, end the notes with a link to the full diff:
                https://github.com/${{ github.repository }}/compare/<previous-tag>...${{ steps.version.outputs.version }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          set -eu
          gh release create "$VERSION" \
            --draft \
            --target "$TARGET_BRANCH" \
            --title "$(cat .release/title.txt)" \
            --notes-file .release/notes.md
