name: FIPS release PR merged

# Watches for the automated fips-branch merge pull request (opened by
# prepare-fips-release.yml) landing on fips, and hands off to the reusable
# draft-release.yml workflow to tag fips and draft the FIPS GitHub release.

on:
  pull_request:
    types: [closed]
    branches: [fips]

permissions:
  contents: write

jobs:
  draft-release:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'automated-fips-release')
    permissions:
      contents: write
    uses: ./.github/workflows/draft-release.yml
    secrets: inherit
    with:
      target-branch: fips
      fips: true
